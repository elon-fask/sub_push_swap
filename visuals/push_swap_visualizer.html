<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>42 push_swap Algorithm Visualizer (n = 8)</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-hover: #334155;
    --border: #334155;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --primary: #38bdf8;
    --primary-dark: #0284c7;
    --accent: #a78bfa;
    --success: #34d399;
    --warning: #fbbf24;
    --danger: #f87171;
    --radius: 12px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 1.5rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .container {
    width: 100%;
    max-width: 1050px;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  header h1 span {
    color: var(--primary);
  }

  .badge {
    background: rgba(56, 189, 248, 0.15);
    color: var(--primary);
    border: 1px solid rgba(56, 189, 248, 0.3);
    padding: 0.25rem 0.75rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
  }

  .controls-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1rem;
    background: var(--surface);
    padding: 1rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .control-group label {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    font-weight: 600;
  }

  .algo-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.35rem;
  }

  button {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 0.5rem 0.65rem;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  button:hover:not(:disabled) {
    background: var(--surface-hover);
    border-color: var(--primary);
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  button.active {
    background: var(--primary-dark);
    border-color: var(--primary);
    color: #fff;
  }

  .preset-row {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
  }

  .preset-row input {
    flex: 1;
    min-width: 140px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.45rem 0.65rem;
    border-radius: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.85rem;
  }

  .preset-row input:focus {
    outline: none;
    border-color: var(--primary);
  }

  .main-grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 1.25rem;
  }

  @media (max-width: 820px) {
    .main-grid {
      grid-template-columns: 1fr;
    }
    .algo-tabs {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .stacks-wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    min-height: 360px;
  }

  .stack-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .stack-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 0.5rem;
    border-bottom: 1px dashed var(--border);
    font-size: 0.9rem;
    font-weight: 700;
  }

  .stack-header span.count {
    font-size: 0.75rem;
    color: var(--text-muted);

  }

  .stack-items {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    padding: 0.75rem 0;
    flex: 1;
    justify-content: flex-start;
  }

    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.45rem 0.75rem;
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

    font-size: 0.9rem;

  .stack-base {

  .playback-bar {
    display: flex;
    flex-wrap: wrap;

  }

  .playback-buttons {
    display: flex;

  }

  .speed-control {
    display: flex;
    align-items: center;

    font-size: 0.8rem;

  }

  .step-banner {
    background: rgba(56, 189, 248, 0.1);
    border-left: 4px solid var(--primary);
    padding: 0.75rem 1rem;
    border-radius: 0 8px 8px 0;

    flex-direction: column;

    background: var(--primary);

    padding: 0.15rem 0.55rem;

    font-size: 0.9rem;
  }

    font-size: 0.88rem;

  }

  .algo-summary {

  }

  .algo-summary strong {

  .ops-history {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;

    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .op-chip {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.78rem;
    padding: 0.2rem 0.45rem;
    border-radius: 4px;
    background: var(--surface);
    color: var(--text-muted);

  }

  .op-chip.current {

    border-color: var(--primary);
    font-weight: 700;
  }

  .op-chip.past {

  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.5rem;
  }

  .stat-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.5rem;
    text-align: center;
  }

  .stat-box .val {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--primary);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  .stat-box .lbl {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .error-msg {
    color: var(--danger);
    font-size: 0.8rem;
    min-height: 1.1rem;
  }
</style>

<body>
<div class="container">
  <header>
    <div>
      <h1>42 <span>push_swap</span> Algorithm Visualizer</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Compare Turk, Insertion, Radix, and Chunking sort on n = 8 elements</p>
    </div>
    <div class="badge">n = 8 Elements</div>
  </header>

  <div class="controls-bar">
    <div class="control-group">
      <label>1. Choose Sorting Algorithm</label>
      <div class="algo-tabs" id="algoTabs">
        <button data-algo="turk" class="active">Turk</button>
        <button data-algo="insertion">Insertion</button>
        <button data-algo="radix">Radix</button>
        <button data-algo="chunking">Chunking</button>
      </div>
    </div>

    <div class="control-group">
      <label>2. Input Array (8 Unique Integers)</label>
      <div class="preset-row">
        <input type="text" id="arrayInput" value="42, -5, 19, 0, 88, 7, -12, 31" aria-label="8 integers separated by commas or spaces">
        <button id="applyBtn">Load</button>
        <button id="randomBtn" title="Generate 8 random numbers">Shuffle</button>
      </div>
      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>

  <div class="main-grid">
    <!-- Left Column: Stacks & Playback -->
    <div class="card">
      <div class="step-banner">
        <div class="op-line">
          <span class="op-pill" id="currentOp">INIT</span>
          <span style="font-size: 0.82rem; color: var(--text-muted);" id="stepCounter">Step 0 / 0</span>
        </div>
        <div class="step-note" id="stepNote">Initial unsorted state in Stack A.</div>
      </div>

      <div class="stacks-wrapper">
        <div class="stack-box">
          <div class="stack-header">
            <span>Stack A</span>
            <span class="count" id="countA">8 items</span>
          </div>
          <div class="stack-items" id="stackA"></div>
          <div class="stack-base">Bottom of A</div>
        </div>

        <div class="stack-box">
          <div class="stack-header">
            <span>Stack B</span>
            <span class="count" id="countB">0 items</span>
          </div>
          <div class="stack-items" id="stackB"></div>
          <div class="stack-base">Bottom of B</div>
        </div>
      </div>

      <div class="playback-bar">
        <div class="playback-buttons">
          <button id="resetBtn" title="Reset to start">&#9198; Reset</button>
          <button id="prevBtn" title="Previous step">&#9664; Prev</button>
          <button id="playBtn" class="active" title="Play or Pause">&#9654; Play</button>
          <button id="nextBtn" title="Next step">Next &#9654;</button>
        </div>
        <div class="speed-control">
          <label for="speedRange">Speed</label>
          <input type="range" id="speedRange" min="150" max="1400" step="50" value="650" style="direction: rtl;">
        </div>
      </div>
    </div>

    <!-- Right Column: Algorithm Details & Move Log -->
    <div class="card">
      <div>
        <h3 style="font-size: 1rem; margin-bottom: 0.5rem;" id="algoTitle">Turk Algorithm (Greedy Cost-Based)</h3>
        <div class="algo-summary" id="algoDesc"></div>
      </div>

      <div>
        <label style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 0.4rem;">
          Total Move Comparison (Current Array)
        </label>
        <div class="stats-row" id="comparisonStats"></div>
      </div>

      <div style="flex: 1; display: flex; flex-direction: column;">
        <label style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 0.4rem;">
          Instruction Trace (Click any move to jump)
        </label>
        <div class="ops-history" id="opsHistory"></div>
      </div>
    </div>
  </div>
</div>

<script>
const ALGO_INFO = {
  turk: {
    title: "Turk Algorithm (Greedy Cost-Based)",
    desc: "<strong>Strategy:</strong> Pushes 2 items to B, then calculates the exact rotation cost for every element in A to reach its descending target spot in B. Uses simultaneous rotations (<code>rr</code> / <code>rrr</code>) to save moves, sorts the final 3 items in A, and merges B back."
  },
  insertion: {
    title: "Insertion Sort (Selection Push)",
    desc: "<strong>Strategy:</strong> Scans Stack A for the smallest remaining element, rotates it to the top via the shortest direction (<code>ra</code> or <code>rra</code>), and pushes it to B (<code>pb</code>). Once 3 elements remain in A, sorts them and pushes all items back from B (<code>pa</code>)."
  },
  radix: {
    title: "Radix Sort (LSD Bitwise)",
    desc: "<strong>Strategy:</strong> Normalizes values to sorted ranks <code>0..7</code> (3 bits). Inspects each bit from least significant (bit 0) to most significant (bit 2): pushes <code>0</code>-bits to B (<code>pb</code>), rotates <code>1</code>-bits in A (<code>ra</code>), then empties B back to A (<code>pa</code>)."
  },
  chunking: {
    title: "Chunking Sort (Range Partitioning)",
    desc: "<strong>Strategy:</strong> Splits sorted ranks <code>0..7</code> into 2 chunks of 4 (<code>0..3</code> and <code>4..7</code>). Pushes numbers in the active range to B—rotating the lower half of each chunk to the bottom of B (<code>rb</code>)—then pulls the largest values back to A in order."
  }
};

// Color palette mapped to rank 0..7
const RANK_COLORS = [
  "#38bdf8", // 0 - sky
  "#2dd4bf", // 1 - teal
  "#34d399", // 2 - emerald
  "#a3e635", // 3 - lime
  "#facc15", // 4 - yellow
  "#fb923c", // 5 - orange
  "#f87171", // 6 - coral
  "#c084fc"  // 7 - purple
];

class PushSwapSim {
  constructor(arr) {
    const sorted = [...arr].sort((a, b) => a - b);
    this.a = arr.map(val => ({ val, rank: sorted.indexOf(val) }));
    this.b = [];
    this.steps = [{
      a: this.clone(this.a),
      b: this.clone(this.b),
      op: "START",
      note: "Initial unsorted state in Stack A."
    }];
  }

  clone(stack) {
    return stack.map(item => ({ ...item }));
  }

  record(op, note) {
    this.steps.push({
      a: this.clone(this.a),
      b: this.clone(this.b),
      op,
      note
    });
  }

  sa(note = "Swap top 2 elements of Stack A") {
    if (this.a.length < 2) return;
    [this.a[0], this.a[1]] = [this.a[1], this.a[0]];
    this.record("sa", note);
  }

  sb(note = "Swap top 2 elements of Stack B") {
    if (this.b.length < 2) return;
    [this.b[0], this.b[1]] = [this.b[1], this.b[0]];
    this.record("sb", note);
  }

  pa(note = "Push top of Stack B onto Stack A") {
    if (this.b.length === 0) return;
    const item = this.b.shift();
    this.a.unshift(item);
    this.record("pa", `${note} (${item.val})`);
  }

  pb(note = "Push top of Stack A onto Stack B") {
    if (this.a.length === 0) return;
    const item = this.a.shift();
    this.b.unshift(item);
    this.record("pb", `${note} (${item.val})`);
  }

  ra(note = "Rotate Stack A up (top moves to bottom)") {
    if (this.a.length < 2) return;
    this.a.push(this.a.shift());
    this.record("ra", note);
  }

  rb(note = "Rotate Stack B up (top moves to bottom)") {
    if (this.b.length < 2) return;
    this.b.push(this.b.shift());
    this.record("rb", note);
  }

  rr(note = "Simultaneously rotate both Stack A and Stack B up") {
    if (this.a.length >= 2) this.a.push(this.a.shift());
    if (this.b.length >= 2) this.b.push(this.b.shift());
    this.record("rr", note);
  }

  rra(note = "Reverse rotate Stack A (bottom moves to top)") {
    if (this.a.length < 2) return;
    this.a.unshift(this.a.pop());
    this.record("rra", note);
  }

  rrb(note = "Reverse rotate Stack B (bottom moves to top)") {
    if (this.b.length < 2) return;
    this.b.unshift(this.b.pop());
    this.record("rrb", note);
  }

  rrr(note = "Simultaneously reverse rotate Stack A and Stack B") {
    if (this.a.length >= 2) this.a.unshift(this.a.pop());
    if (this.b.length >= 2) this.b.unshift(this.b.pop());
    this.record("rrr", note);
  }

  isSortedA() {
    for (let i = 0; i < this.a.length - 1; i++) {
      if (this.a[i].rank > this.a[i + 1].rank) return false;
    }
    return true;
  }

  sortThreeA() {
    if (this.a.length !== 3) return;
    const [x, y, z] = this.a.map(i => i.rank);
    if (x > y && y < z && x < z) this.sa("Sort 3 in A: swap top two");
    else if (x > y && y > z) {
      this.sa("Sort 3 in A: swap top two");
      this.rra("Sort 3 in A: reverse rotate bottom to top");
    } else if (x > y && y < z && x > z) {
      this.ra("Sort 3 in A: rotate largest to bottom");
    } else if (x < y && y > z && x < z) {
      this.sa("Sort 3 in A: swap top two");
      this.ra("Sort 3 in A: rotate into ascending order");
    } else if (x < y && y > z && x > z) {
      this.rra("Sort 3 in A: bring smallest from bottom to top");
    }
  }
}

// 1. TURK ALGORITHM
function runTurk(arr) {
  const sim = new PushSwapSim(arr);
  if (sim.isSortedA()) return sim.steps;

  sim.pb("Initial setup: push 1st element to B");
  sim.pb("Initial setup: push 2nd element to B");

  // Push from A to B keeping B descending
  while (sim.a.length > 3) {
    let bestMove = null;

    for (let idxA = 0; idxA < sim.a.length; idxA++) {
      const rankA = sim.a[idxA].rank;
      // Target in B: closest smaller rank, or max rank in B if none smaller
      let targetIdxB = -1;
      let bestSmallerRank = -1;
      let maxRankB = -1;
      let maxIdxB = 0;

      for (let j = 0; j < sim.b.length; j++) {
        const rB = sim.b[j].rank;
        if (rB > maxRankB) {
          maxRankB = rB;
          maxIdxB = j;
        }
        if (rB < rankA && rB > bestSmallerRank) {
          bestSmallerRank = rB;
          targetIdxB = j;
        }
      }
      if (targetIdxB === -1) targetIdxB = maxIdxB;

      // Evaluate all 4 rotation combinations to pick minimum cost
      const lenA = sim.a.length;
      const lenB = sim.b.length;
      const ra = idxA, rra = (lenA - idxA) % lenA;
      const rb = targetIdxB, rrb = (lenB - targetIdxB) % lenB;

      const options = [
        { cost: Math.max(ra, rb), dirA: "up", dirB: "up", stepsA: ra, stepsB: rb },
        { cost: Math.max(rra, rrb), dirA: "down", dirB: "down", stepsA: rra, stepsB: rrb },
        { cost: ra + rrb, dirA: "up", dirB: "down", stepsA: ra, stepsB: rrb },
        { cost: rra + rb, dirA: "down", dirB: "up", stepsA: rra, stepsB: rb }
      ];

      options.sort((x, y) => x.cost - y.cost);
      const bestForNode = options[0];

      if (!bestMove || bestForNode.cost < bestMove.cost) {
        bestMove = { ...bestForNode, val: sim.a[idxA].val };
      }
    }

    // Execute chosen rotations
    let { dirA, dirB, stepsA, stepsB, val } = bestMove;
    if (dirA === "up" && dirB === "up") {
      while (stepsA > 0 && stepsB > 0) {
        sim.rr(`Combined rotate for cheapest node (${val})`);
        stepsA--; stepsB--;
      }
    } else if (dirA === "down" && dirB === "down") {
      while (stepsA > 0 && stepsB > 0) {
        sim.rrr(`Combined reverse-rotate for cheapest node (${val})`);
        stepsA--; stepsB--;
      }
    }
    while (stepsA-- > 0) {
      dirA === "up" ? sim.ra(`Align ${val} to top of A`) : sim.rra(`Align ${val} to top of A`);
    }
    while (stepsB-- > 0) {
      dirB === "up" ? sim.rb(`Align target slot in B for ${val}`) : sim.rrb(`Align target slot in B for ${val}`);
    }
    sim.pb("Push cheapest aligned element to B");
  }

  sim.sortThreeA();

  // Push everything back from B to A
  while (sim.b.length > 0) {
    const rankB = sim.b[0].rank;
    const valB = sim.b[0].val;
    // Find closest larger rank in A, or min rank in A
    let targetIdxA = -1;
    let bestLargerRank = Infinity;
    let minRankA = Infinity;
    let minIdxA = 0;

    for (let i = 0; i < sim.a.length; i++) {
      const rA = sim.a[i].rank;
      if (rA < minRankA) {
        minRankA = rA;
        minIdxA = i;
      }
      if (rA > rankB && rA < bestLargerRank) {
        bestLargerRank = rA;
        targetIdxA = i;
      }
    }
    if (targetIdxA === -1) targetIdxA = minIdxA;

    const lenA = sim.a.length;
    if (targetIdxA <= lenA / 2) {
      for (let k = 0; k < targetIdxA; k++) sim.ra(`Rotate A to place target above ${valB}`);
    } else {
      for (let k = 0; k < lenA - targetIdxA; k++) sim.rra(`Reverse-rotate A to place target above ${valB}`);
    }
    sim.pa("Insert element from B into sorted position in A");
  }

  // Final rotation so rank 0 is at top of A
  const zeroIdx = sim.a.findIndex(x => x.rank === 0);
  if (zeroIdx <= sim.a.length / 2) {
    for (let k = 0; k < zeroIdx; k++) sim.ra("Final alignment: bring minimum to top of A");
  } else {
    for (let k = 0; k < sim.a.length - zeroIdx; k++) sim.rra("Final alignment: bring minimum to top of A");
  }

  return sim.steps;
}

// 2. INSERTION (SELECTION PUSH) SORT
function runInsertion(arr) {
  const sim = new PushSwapSim(arr);
  if (sim.isSortedA()) return sim.steps;

  while (sim.a.length > 3) {
    let minIdx = 0;
    for (let i = 1; i < sim.a.length; i++) {
      if (sim.a[i].rank < sim.a[minIdx].rank) minIdx = i;
    }
    const minVal = sim.a[minIdx].val;
    const len = sim.a.length;
    if (minIdx <= len / 2) {
      for (let k = 0; k < minIdx; k++) sim.ra(`Rotate smallest (${minVal}) toward top of A`);
    } else {
      for (let k = 0; k < len - minIdx; k++) sim.rra(`Reverse-rotate smallest (${minVal}) toward top of A`);
    }
    sim.pb("Push current minimum to Stack B");
  }

  sim.sortThreeA();

  while (sim.b.length > 0) {
    sim.pa("Push sorted elements back to Stack A");
  }
  return sim.steps;
}

// 3. RADIX SORT (LSD BITWISE)
function runRadix(arr) {
  const sim = new PushSwapSim(arr);
  if (sim.isSortedA()) return sim.steps;

  const maxBits = 3; // n = 8 -> ranks 0..7 -> 3 bits
  for (let bit = 0; bit < maxBits; bit++) {
    const count = sim.a.length;
    for (let i = 0; i < count; i++) {
      const top = sim.a[0];
      if (((top.rank >> bit) & 1) === 0) {
        sim.pb(`Bit ${bit} is 0 for rank ${top.rank}: push to B`);
      } else {
        sim.ra(`Bit ${bit} is 1 for rank ${top.rank} (${top.val}): keep in A`);
      }
    }
    while (sim.b.length > 0) {
      sim.pa(`End of bit ${bit} pass: return item to A`);
    }
    if (sim.isSortedA()) break;
  }
  return sim.steps;
}

// 4. CHUNKING SORT
function runChunking(arr) {
  const sim = new PushSwapSim(arr);
  if (sim.isSortedA()) return sim.steps;

  // 2 chunks of 4 for n = 8: [0..3] then [4..7]
  const chunks = [
    { min: 0, max: 3, mid: 1 },
    { min: 4, max: 7, mid: 5 }
  ];

  for (const ch of chunks) {
    let pushed = 0;
    const targetCount = ch.max - ch.min + 1;
    while (pushed < targetCount && sim.a.length > 0) {
      const top = sim.a[0];
      if (top.rank >= ch.min && top.rank <= ch.max) {
        sim.pb(`Rank ${top.rank} fits chunk [${ch.min}..${ch.max}]: push to B`);
        pushed++;
        if (top.rank <= ch.mid && sim.b.length > 1) {
          sim.rb(`Rank ${top.rank} <= mid (${ch.mid}): rotate to bottom of B`);
        }
      } else {
        sim.ra(`Rank ${top.rank} (${top.val}) outside chunk [${ch.min}..${ch.max}]: rotate A`);
      }
    }
  }

  // Pull max elements back from B to A in descending order
  while (sim.b.length > 0) {
    let maxIdx = 0;
    for (let i = 1; i < sim.b.length; i++) {
      if (sim.b[i].rank > sim.b[maxIdx].rank) maxIdx = i;
    }
    const maxVal = sim.b[maxIdx].val;
    const len = sim.b.length;
    if (maxIdx <= len / 2) {
      for (let k = 0; k < maxIdx; k++) sim.rb(`Bring max (${maxVal}) to top of B`);
    } else {
      for (let k = 0; k < len - maxIdx; k++) sim.rrb(`Reverse-rotate max (${maxVal}) to top of B`);
    }
    sim.pa("Push largest remaining element to A");
  }

  return sim.steps;
}

// UI State & Controller
let currentArray = [42, -5, 19, 0, 88, 7, -12, 31];
let currentAlgo = "turk";
let allRuns = {};
let stepIndex = 0;
let timer = null;

function computeAllRuns(arr) {
  allRuns = {
    turk: runTurk(arr),
    insertion: runInsertion(arr),
    radix: runRadix(arr),
    chunking: runChunking(arr)
  };
}

function renderComparisonStats() {
  const container = document.getElementById("comparisonStats");
  container.innerHTML = "";
  const names = { turk: "Turk", insertion: "Insertion", radix: "Radix", chunking: "Chunking" };
  for (const key of Object.keys(names)) {
    const moves = allRuns[key].length - 1;
    const div = document.createElement("div");
    div.className = "stat-box";
    if (key === currentAlgo) div.style.borderColor = "var(--primary)";
    div.innerHTML = `<div class="val">${moves}</div><div class="lbl">${names[key]}</div>`;
    container.appendChild(div);
  }
}

function renderStack(elId, countId, items) {
  const el = document.getElementById(elId);
  document.getElementById(countId).textContent = `${items.length} item${items.length === 1 ? "" : "s"}`;
  el.innerHTML = "";
  items.forEach(item => {
    const bar = document.createElement("div");
    bar.className = "stack-item";
    bar.style.backgroundColor = RANK_COLORS[item.rank];
    // Subtle width scaling by rank for immediate visual ordering cues
    const widthPct = 58 + (item.rank * 6);
    bar.style.width = `${widthPct}%`;
    bar.innerHTML = `<span>${item.val}</span><span class="idx-tag">idx:${item.rank}</span>`;
    el.appendChild(bar);
  });
}

function renderHistory(steps) {
  const container = document.getElementById("opsHistory");
  container.innerHTML = "";
  steps.forEach((st, idx) => {
    const chip = document.createElement("span");
    chip.className = "op-chip" + (idx === stepIndex ? " current" : idx < stepIndex ? " past" : "");
    chip.textContent = idx === 0 ? "0:START" : `${idx}:${st.op}`;
    chip.onclick = () => {
      pause();
      stepIndex = idx;
      renderStep();
    };
    container.appendChild(chip);
  });
  const activeChip = container.querySelector(".current");
  if (activeChip) {
    activeChip.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
}

function renderStep() {
  const steps = allRuns[currentAlgo];
  const state = steps[stepIndex];
  document.getElementById("currentOp").textContent = state.op.toUpperCase();
  document.getElementById("stepCounter").textContent = `Move ${stepIndex} / ${steps.length - 1}`;
  document.getElementById("stepNote").textContent = state.note;

  renderStack("stackA", "countA", state.a);
  renderStack("stackB", "countB", state.b);
  renderHistory(steps);

  document.getElementById("prevBtn").disabled = stepIndex === 0;
  document.getElementById("nextBtn").disabled = stepIndex === steps.length - 1;
}

function selectAlgo(algo) {
  pause();
  currentAlgo = algo;
  stepIndex = 0;

  document.querySelectorAll("#algoTabs button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.algo === algo);
  });

  document.getElementById("algoTitle").textContent = ALGO_INFO[algo].title;
  document.getElementById("algoDesc").innerHTML = ALGO_INFO[algo].desc;
  renderComparisonStats();
  renderStep();
}

function play() {
  const steps = allRuns[currentAlgo];
  if (stepIndex >= steps.length - 1) stepIndex = 0;
  const playBtn = document.getElementById("playBtn");
  playBtn.innerHTML = "&#10074;&#10074; Pause";
  const delay = parseInt(document.getElementById("speedRange").value, 10);

  clearInterval(timer);
  timer = setInterval(() => {
    if (stepIndex < allRuns[currentAlgo].length - 1) {
      stepIndex++;
      renderStep();
    } else {
      pause();
    }
  }, delay);
}

function pause() {
  clearInterval(timer);
  timer = null;
  document.getElementById("playBtn").innerHTML = "&#9654; Play";
}

function parseAndLoadArray(raw) {
  const errEl = document.getElementById("errorMsg");
  const parts = raw.split(/[\s,]+/).filter(Boolean);
  if (parts.length !== 8) {
    errEl.textContent = "Please enter exactly 8 integers.";
    return;
  }
  const nums = parts.map(Number);
  if (nums.some(n => !Number.isInteger(n))) {
    errEl.textContent = "All entries must be valid integers.";
    return;
  }
  if (new Set(nums).size !== 8) {
    errEl.textContent = "All 8 integers must be unique (no duplicates).";
    return;
  }
  errEl.textContent = "";
  currentArray = nums;
  pause();
  computeAllRuns(currentArray);
  stepIndex = 0;
  renderComparisonStats();
  renderStep();
}

function generateRandom8() {
  const pool = new Set();
  while (pool.size < 8) {
    pool.add(Math.floor(Math.random() * 140) - 40);
  }
  const arr = Array.from(pool);
  document.getElementById("arrayInput").value = arr.join(", ");
  parseAndLoadArray(arr.join(", "));
}

// Event Listeners
document.querySelectorAll("#algoTabs button").forEach(btn => {
  btn.addEventListener("click", () => selectAlgo(btn.dataset.algo));
});

document.getElementById("applyBtn").addEventListener("click", () => {
  parseAndLoadArray(document.getElementById("arrayInput").value);
});

document.getElementById("randomBtn").addEventListener("click", generateRandom8);

document.getElementById("resetBtn").addEventListener("click", () => {
  pause();
  stepIndex = 0;
  renderStep();
});

document.getElementById("prevBtn").addEventListener("click", () => {
  pause();
  if (stepIndex > 0) {
    stepIndex--;
    renderStep();
  }
});

document.getElementById("nextBtn").addEventListener("click", () => {
  pause();
  if (stepIndex < allRuns[currentAlgo].length - 1) {
    stepIndex++;
    renderStep();
  }
});

document.getElementById("playBtn").addEventListener("click", () => {
  if (timer) pause();
  else play();
});

document.getElementById("speedRange").addEventListener("input", () => {
  if (timer) play();
});

// Initialize
computeAllRuns(currentArray);
selectAlgo("turk");
</script>
</body>
</html>
